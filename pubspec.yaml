name: flutter_easy_camera
description: "A native (CameraX / AVFoundation) Flutter camera with customizable
  controls, framing overlays and AI-ready captures that are resized, compressed
  and encoded for vision models."
version: 1.0.0
homepage: https://github.com/TheinvinciblePrints/easy_camera

environment:
  sdk: ^3.7.0
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  pigeon: ^29.0.11

flutter:
  plugin:
    platforms:
      android:
        package: com.codewithemmany.flutter_easy_camera
        pluginClass: FlutterEasyCameraPlugin
      ios:
        pluginClass: FlutterEasyCameraPlugin
