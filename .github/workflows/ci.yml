name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.0"

jobs:
  checks:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: |
          flutter pub get
          (cd example && flutter pub get)

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test pigeons example/lib example/test

      - name: Analyze
        run: flutter analyze

      - name: Check Pigeon output is up to date
        run: |
          dart run pigeon --input pigeons/messages.dart
          dart format lib/src/platform/messages.g.dart
          git diff --exit-code -- lib/src/platform android/src ios/flutter_easy_camera/Sources \
            || { echo "::error::Generated Pigeon files are stale. Run 'dart run pigeon --input pigeons/messages.dart' and commit."; exit 1; }

      - name: Test package
        run: flutter test

      - name: Test example
        working-directory: example
        run: flutter test

  android:
    name: Build Android example
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/build.gradle.kts', 'example/android/**/*.gradle.kts', 'example/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build debug APK
        working-directory: example
        run: flutter build apk --debug

  ios:
    name: Build iOS example (${{ matrix.dependency-manager }})
    needs: checks
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        dependency-manager: [cocoapods, swiftpm]
    steps:
      # SwiftPM rejects the example's local plugin package when the checkout
      # folder name differs from the plugin name, so match it here.
      - uses: actions/checkout@v4
        with:
          path: flutter_easy_camera

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Select dependency manager
        run: |
          if [ "${{ matrix.dependency-manager }}" = "swiftpm" ]; then
            flutter config --enable-swift-package-manager
          else
            flutter config --no-enable-swift-package-manager
          fi

      - name: Build for simulator
        working-directory: flutter_easy_camera/example
        run: flutter build ios --simulator --debug
